# 找客户机器人：每天早上自动找新店家放进工作台收件箱（scripts/robot/find-leads.mjs，说明在 sales/leads/README.md）
# 需要的 Secrets（GitHub → Settings → Secrets and variables → Actions）：DEEPSEEK_API_KEY，和 EXA_API_KEY / TAVILY_API_KEY / SERPER_API_KEY / BRAVE_API_KEY 其中一个
name: Lead robot (daily new shops)
on:
  schedule:
    - cron: '23 22 * * *'   # every day 06:23 Malaysia time
  workflow_dispatch:
    inputs:
      max_leads:
        description: 'At most how many shops'
        default: '100'
permissions:
  contents: write
concurrency:
  group: find-leads
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: leads
          path: leads
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find shops
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          ROBOT_MAX_LEADS: ${{ inputs.max_leads || vars.ROBOT_MAX_LEADS || '100' }}
          ROBOT_MAX_QUERIES: ${{ vars.ROBOT_MAX_QUERIES || '40' }}
        run: node main/scripts/robot/find-leads.mjs --leads-dir leads/sales/leads
      - name: Put them in the desk inbox (leads branch, no deploy)
        working-directory: leads
        run: |
          python3 site/build.py > /dev/null
          git config user.name "cartsmith-lead-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales/leads/*.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "[skip ci] Leads robot $(TZ=Asia/Kuala_Lumpur date +%F)"
          git push origin HEAD:leads
