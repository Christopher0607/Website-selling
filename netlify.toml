# Netlify 设定：工作室网站 + 6 个网店模板（静态网页）+ AI 聊天函数（DeepSeek）
# 部署步骤见 docs/09-netlify-guide.md
[build]
  base = "site"
  command = "python3 build.py"
  publish = "dist"
  functions = "netlify/functions"
  # 省 Netlify 点数（免费方案每次正式部署 15 点）：leads 分支、只改文件的 commit 不 build
  ignore = "bash ../scripts/netlify-ignore.sh"

# 样板店不给搜索引擎收录
[[headers]]
  for = "/demo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# 销售工作台：不给搜索引擎收录、不缓存
[[headers]]
  for = "/desk/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/demo/*/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
